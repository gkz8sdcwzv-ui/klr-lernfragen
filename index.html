<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KLR Fragen">
<meta name="theme-color" content="#0b1626">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230b1626%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23ffb020%22>KLR</text></svg>">
<title>KLR Lernfragen</title>
<style>
  :root{
    --bg:#0b1626; --card:#122c4d; --card2:#183a63; --line:#24476f;
    --text:#eaf1ff; --muted:#9db2d0; --accent:#ffb020; --accent-ink:#1a1200;
    --green:#3ddc84; --green-bg:rgba(61,220,132,.16);
    --red:#ff6b6b; --red-bg:rgba(255,107,107,.16);
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f5fa; --card:#ffffff; --card2:#eaf0f9; --line:#cdd7e6;
      --text:#14213a; --muted:#5b6b86; --accent:#c77800; --accent-ink:#ffffff;
      --green:#168a4a; --green-bg:rgba(22,138,74,.12);
      --red:#cf3535; --red-bg:rgba(207,53,53,.10);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    min-height:100vh;min-height:100dvh;
    font-size:17px;line-height:1.45;
    touch-action:manipulation;
  }
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
  .wrap{
    max-width:760px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em;}
  h2{font-size:1.05rem;margin:26px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .sub{color:var(--muted);margin:0 0 18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
  .bar.green>i{background:var(--green);}
  .small{font-size:.88rem;color:var(--muted);}

  .btn{
    display:block;width:100%;text-align:center;
    padding:14px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);font-weight:600;
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:1.05rem;}
  .btn:active{transform:scale(.99);}
  .btn[disabled]{opacity:.45;cursor:default;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .btn-link{background:none;border:none;color:var(--muted);padding:10px;text-decoration:underline;font-size:.9rem;}

  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px;}
  .seg button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;}

  .row{
    display:block;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;
  }
  .row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px;font-weight:600;}
  .row .top span:last-child{color:var(--muted);font-weight:500;font-size:.9rem;white-space:nowrap;}

  /* Quiz */
  .qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .qtop .grow{flex:1;}
  .qtop button.end{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px;}
  .chip{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--muted);border:1px solid var(--line);}
  .chip.type{color:var(--accent);border-color:var(--accent);background:transparent;}
  .question{font-size:1.15rem;font-weight:600;white-space:pre-line;margin:0 0 16px;}
  .ctx{white-space:pre-line;font-size:.95rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);
  }
  .opt .L{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card2);font-weight:700;font-size:.9rem;
  }
  .opt .T{flex:1;padding-top:2px;}
  .opt.tf{justify-content:center;font-weight:700;font-size:1.05rem;}
  .opt:not([disabled]):active{border-color:var(--accent);}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.correct .L{background:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.wrong .L{background:var(--red);color:#fff;}
  .opt.dim{opacity:.55;}
  .opt[disabled]{cursor:default;}

  .fb{margin-top:16px;border-radius:var(--radius);padding:14px 16px;border:1px solid var(--line);background:var(--card);scroll-margin-bottom:96px;}
  .fb.ok{border-color:var(--green);background:var(--green-bg);}
  .fb.no{border-color:var(--red);background:var(--red-bg);}
  .fb h3{margin:0 0 6px;font-size:1.05rem;}
  .fb.ok h3{color:var(--green);} .fb.no h3{color:var(--red);}
  .fb p{margin:6px 0 0;}
  .fb .src{margin-top:8px;}
  .next{
    position:sticky;bottom:0;margin-top:14px;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 70%,transparent);
  }

  /* Ergebnis */
  .score{font-size:3rem;font-weight:800;text-align:center;margin:6px 0 0;}
  .score small{font-size:1.2rem;color:var(--muted);font-weight:600;}
  .center{text-align:center;}
  details.wr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:0 14px;}
  details.wr summary{padding:12px 0;cursor:pointer;font-weight:600;white-space:pre-line;}
  details.wr .in{padding:0 0 12px;}
  .ans-ok{color:var(--green);font-weight:600;} .ans-no{color:var(--red);font-weight:600;}
  .hidden{display:none;}
  @media (min-width:700px){
    body{font-size:18px;}
    .question{font-size:1.25rem;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const T1='Rechnungswesen & Grundbegriffe';
const T2='Kostentheorie & Break-even';
const T3='Kostenrechnungssysteme';
const T4='Kostenartenrechnung';
const T5='Kostenstellen & BAB';
const T6='Kostenträgerrechnung';
const T7='Teilkosten & Entscheidungen';
const T8='Plankosten & neuere Ansätze';
const TOPICS=[T1,T2,T3,T4,T5,T6,T7,T8];
const KINDS={v:'Verständnisfrage',f:'Richtig oder falsch',r:'Rechenaufgabe'};
const KINDS_PL={v:'Verständnisfragen',f:'Richtig-/Falsch-Aussagen',r:'Rechenaufgaben'};

const QS=[];
// Q: Verständnisfrage, erste Option ist richtig, Reihenfolge wird gemischt
const Q=(t,q,o,e,s)=>QS.push({t,q,o,a:0,e,s,k:'v',shuffle:true});
// C: Rechenaufgabe, a = Index der richtigen Option (Reihenfolge wird zur Laufzeit gemischt)
const C=(t,q,o,a,e,s)=>QS.push({t,q,o,a,e,s,k:'r',shuffle:true});
// RF: Richtig/Falsch-Aussage
const RF=(t,q,ok,e,s)=>QS.push({t,q,o:['Richtig','Falsch'],a:ok?0:1,e,s,k:'f',shuffle:false});

/* ===== T1: Rechnungswesen & Grundbegriffe ===== */
const MARZ =
"Geschäftsvorfälle im März:\n" +
"(1) Materiallieferung, Rechnung 24.000 €, Zahlungsziel 4 Wochen.\n" +
"(2) Barverkauf von Produkten: 12.000 €.\n" +
"(3) Zahlung Löhne/Gehälter März 16.700 € plus Nachzahlung für Februar 3.300 €.\n" +
"(4) Kunde überweist im März eine Lieferung aus Januar: 25.000 €.\n" +
"(5) Verkauf einer gebrauchten Maschine (Buchwert 5.000 €) für 6.800 € auf Ziel.\n" +
"(6) Zahlung einer fälligen Lieferantenrechnung (5.000 €) wird auf April verschoben.\n" +
"(7) Kauf von Vorprodukten 5.000 €, Barzahlung.\n" +
"(8) Rechnung Best-Consult für Beratung im März: 700 €.\n" +
"(9) Versand/Rechnung Waren 48.500 €; Kunde hatte im Januar 40.000 € angezahlt, Rest wird im März überwiesen.\n" +
"(10) Spende an die örtliche Schule: 300 € bar.\n" +
"(11) Kalkulatorischer Unternehmerlohn März: 8.000 €.\n" +
"(12) Rückstellung für Weihnachtsgeld: 1.000 €.";

Q(T1,"Welchen Zweck verfolgt die Kosten- und Leistungsrechnung (KLR) in erster Linie?",
 ["Informationen für Planung, Steuerung und Kontrolle des Managements bereitstellen",
  "Vermögens- und Ertragslage für Gläubiger und Finanzamt darstellen",
  "Die Steuerbemessungsgrundlage ermitteln",
  "Den Jahresabschluss nach HGB aufstellen"],
 "Die KLR ist internes Rechnungswesen: Sie liefert dem Management Daten zur Planung, Steuerung und Kontrolle. Bilanz und GuV (externes Rechnungswesen) richten sich an Externe.");

Q(T1,"Wer sind die typischen Adressaten der KLR?",
 ["Unternehmensführung und interne Entscheidungsträger",
  "Anteilseigner, Gläubiger und Finanzamt",
  "Ausschließlich das Finanzamt",
  "Die interessierte Öffentlichkeit"],
 "Die KLR ist intern ausgerichtet. Externe Adressaten bedient die Finanzbuchführung.");

Q(T1,"Welche Aussage zum Unterschied zwischen Finanzbuchführung und KLR stimmt?",
 ["Die Finanzbuchführung ist gesetzlich normiert (HGB, Steuerrecht), die KLR kann unternehmensindividuell gestaltet werden",
  "Die KLR ist durch HGB und GoB normiert, die Finanzbuchführung ist frei gestaltbar",
  "Beide sind gesetzlich normiert und müssen veröffentlicht werden",
  "Beide sind frei gestaltbar und werden nicht veröffentlicht"],
 "Die KLR hat keine gesetzlichen Grundlagen und wird nicht veröffentlicht. Die Finanzbuchführung folgt HGB, EStG, AO, GoB bzw. IFRS.");

Q(T1,"Was ist der Gegenstand der KLR?",
 ["Das Betriebsergebnis (Leistung – Kosten)",
  "Das Gesamtergebnis der GuV (Ertrag – Aufwand)",
  "Der Zahlungsmittelbestand",
  "Das Eigenkapital laut Bilanz"],
 "Die KLR bildet das betriebliche Ergebnis ab. Das neutrale Ergebnis (nicht betriebszweckbezogen) wird abgegrenzt.");

Q(T1,"Wie ist das Betriebsergebnis definiert?",
 ["Leistung – Kosten","Ertrag – Aufwand","Einnahmen – Ausgaben","Einzahlungen – Auszahlungen"],
 "Betriebsergebnis = Leistung – Kosten. Ertrag – Aufwand ist das Gesamtergebnis der Finanzbuchführung.");

Q(T1,"Wie sind Kosten definiert?",
 ["Bewerteter, betriebszweckbezogener Verzehr von Gütern und Dienstleistungen",
  "Jede Auszahlung einer Periode",
  "Jeder Aufwand der Finanzbuchführung",
  "Jede Ausgabe, die das Geldvermögen mindert"],
 "Kosten sind der wertmäßige Input für die Herstellung und den Absatz betrieblicher Leistungen. Nicht jede Auszahlung oder jeder Aufwand ist Kosten.");

Q(T1,"Was versteht man unter Leistung in der KLR?",
 ["Bewertete Güter und Dienstleistungen, die im betrieblichen Produktionsprozess erstellt werden (wertmäßiger Output, Erlöse)",
  "Jede Einzahlung der Periode",
  "Jeder Ertrag laut GuV",
  "Die Produktionsmenge in Stück"],
 "Leistung ist der wertmäßige Output des Betriebszwecks. Neutrale Erträge (z. B. Mieterträge) zählen nicht dazu.");

Q(T1,"Was ergibt die Differenz Einzahlungen – Auszahlungen?",
 ["Veränderung des Zahlungsmittelbestands (Kasse + Bankguthaben)",
  "Veränderung des Geldvermögens",
  "Veränderung des Reinvermögens",
  "Betriebsergebnis"],
 "Einzahlungen – Auszahlungen = Zahlungsmittelveränderung.");

Q(T1,"Was ergibt die Differenz Einnahmen – Ausgaben?",
 ["Veränderung des Geldvermögens",
  "Veränderung des Zahlungsmittelbestands",
  "Veränderung des Reinvermögens (Eigenkapital)",
  "Betriebsbedingte Reinvermögensänderung"],
 "Einnahmen – Ausgaben = Veränderung des Geldvermögens (Zahlungsmittel + Forderungen – Verbindlichkeiten).");

Q(T1,"Was ergibt die Differenz Ertrag – Aufwand?",
 ["Veränderung des Reinvermögens (Eigenkapital)",
  "Veränderung des Zahlungsmittelbestands",
  "Veränderung des Geldvermögens",
  "Betriebsergebnis der KLR"],
 "Ertrag – Aufwand = Gesamtergebnis der Finanzbuchführung = Änderung des Reinvermögens.");

Q(T1,"Was ergibt die Differenz Leistung – Kosten?",
 ["Betriebsbedingte Reinvermögensänderung (Änderung des Betriebsvermögens)",
  "Veränderung des Geldvermögens",
  "Neutrales Ergebnis",
  "Veränderung des Zahlungsmittelbestands"],
 "Leistung – Kosten = Betriebsergebnis = betriebsbedingte Reinvermögensänderung.");

Q(T1,"Wie setzt sich das Geldvermögen zusammen?",
 ["Zahlungsmittel + Forderungen – Verbindlichkeiten",
  "Kasse + Vorräte",
  "Reinvermögen + Verbindlichkeiten",
  "Zahlungsmittel + Anlagevermögen"],
 "Geldvermögen = Zahlungsmittel + Forderungen – Verbindlichkeiten. Zahlungsmittel = Kasse + verfügbare Bankguthaben.");

Q(T1,"Ein Kunde überweist im März eine Rechnung für eine Lieferung aus Januar. Was liegt im März vor?",
 ["Eine Einzahlung, aber weder Einnahme noch Ertrag des März",
  "Einzahlung, Einnahme und Ertrag",
  "Eine Einnahme, aber keine Einzahlung",
  "Weder Einzahlung noch Einnahme"],
 "Einnahme und Ertrag entstanden bereits im Januar bei Rechnungsstellung (Forderung). Im März ändert sich nur der Zahlungsmittelbestand.");

Q(T1,"Material wird auf Ziel geliefert (Zahlungsziel 4 Wochen). Was gilt zum Zeitpunkt der Lieferung?",
 ["Ausgabe (Verbindlichkeit), aber keine Auszahlung",
  "Auszahlung, aber keine Ausgabe",
  "Auszahlung und Ausgabe",
  "Weder Ausgabe noch Auszahlung"],
 "Die Verbindlichkeit mindert das Geldvermögen (Ausgabe). Der Zahlungsmittelabfluss (Auszahlung) folgt erst bei Bezahlung.");

Q(T1,"Eine Spende von 300 € wird bar an die örtliche Schule gezahlt. Wie ist das einzuordnen?",
 ["Auszahlung, Ausgabe und Aufwand, aber keine Kosten (neutraler Aufwand)",
  "Auszahlung, Ausgabe, Aufwand und Kosten",
  "Nur Auszahlung",
  "Zusatzkosten"],
 "Die Spende ist nicht betriebszweckbezogen und damit neutraler Aufwand ohne Kostencharakter.");

Q(T1,"Für den Firmeninhaber werden 8.000 € kalkulatorischer Unternehmerlohn verrechnet. Wie ist das einzuordnen?",
 ["Kosten (Zusatzkosten), aber weder Aufwand noch Auszahlung",
  "Aufwand und Kosten",
  "Auszahlung und Ausgabe",
  "Neutraler Aufwand"],
 "Der Unternehmerlohn wird in der Finanzbuchführung nicht gebucht (durch den Gewinn abgegolten), in der KLR aber als Zusatzkosten angesetzt.");

Q(T1,"Für Weihnachtsgeld wird eine Rückstellung von 1.000 € gebildet. Was gilt?",
 ["Aufwand und Kosten, aber noch keine Auszahlung",
  "Auszahlung und Aufwand",
  "Weder Aufwand noch Kosten",
  "Neutraler Aufwand"],
 "Die Rückstellung verteilt den Personalaufwand periodengerecht. Die Auszahlung erfolgt erst später.");

Q(T1,"Welche Posten gehören typischerweise zum neutralen Aufwand?",
 ["Spenden, Restrukturierungs- bzw. Abfindungsaufwand, Schäden aus Unterschlagung",
  "Materialverbrauch, Fertigungslöhne, Energiekosten",
  "Kalkulatorische Zinsen und kalkulatorischer Unternehmerlohn",
  "Fertigungsmaterial und Hilfsstoffe"],
 "Neutral sind betriebsfremde, außerordentliche und periodenfremde Aufwendungen.");

Q(T1,"Welche drei Arten neutraler Aufwendungen und Erträge werden unterschieden?",
 ["Betriebsfremd, außerordentlich, periodenfremd",
  "Fix, variabel, sprungfix",
  "Einzel-, Gemein-, Sonderkosten",
  "Grund-, Zusatz-, Anderskosten"],
 "Neutrales Ergebnis: betriebsfremd (z. B. Mieterträge, Spenden), außerordentlich (z. B. Restrukturierung), periodenfremd (z. B. Auflösung Rückstellung, Steuernachzahlung).");

Q(T1,"Was sind Zusatzkosten?",
 ["Kosten, denen kein Aufwand gegenübersteht (z. B. kalkulatorischer Unternehmerlohn)",
  "Aufwand ohne Kostencharakter",
  "Kosten, denen Aufwand in anderer Höhe gegenübersteht",
  "Kosten, die direkt einem Kostenträger zugerechnet werden"],
 "Zusatzkosten sind kalkulatorische Kosten ohne Aufwandsgegenstück, z. B. Unternehmerlohn, kalkulatorische Miete, Eigenkapitalzinsen.");

Q(T1,"Was sind Anderskosten?",
 ["Kosten, denen Aufwand in anderer Höhe gegenübersteht (z. B. kalk. Abschreibung auf Wiederbeschaffungswert)",
  "Kosten ohne jeden Aufwand",
  "Neutrale Aufwendungen",
  "Kosten, die nur im Vertrieb anfallen"],
 "Anderskosten entstehen durch abweichende Bewertung in der KLR (z. B. Abschreibung auf Wiederbeschaffungskosten statt Anschaffungskosten).");

Q(T1,"Wie heißen Kosten, die zugleich Aufwand in gleicher Höhe sind?",
 ["Grundkosten (Zweckaufwand)","Zusatzkosten","Anderskosten","Neutrale Kosten"],
 "Grundkosten = betrieblicher Aufwand (Zweckaufwand), z. B. Materialverbrauch, Löhne.");

Q(T1,"Kosten = Aufwand – neutraler Aufwand + kalkulatorische Kosten. Welche Aussage dazu stimmt?",
 ["Kalkulatorische Kosten setzen sich aus Anderskosten und Zusatzkosten zusammen",
  "Kalkulatorische Kosten sind immer Auszahlungen",
  "Kalkulatorische Kosten erscheinen in der GuV",
  "Kalkulatorische Kosten sind neutraler Aufwand"],
 "Kalkulatorische Kosten (Anders- und Zusatzkosten) stehen nur in der KLR, nicht in der GuV, und führen nicht zu Auszahlungen.");

Q(T1,"Welche Frage beantwortet die Kostenartenrechnung?",
 ["Welche Kosten sind in welcher Höhe angefallen?",
  "Wo sind die Kosten angefallen?",
  "Wofür (für welchen Kostenträger) sind die Kosten angefallen?",
  "Wie hoch ist der Gewinn je Produkt?"],
 "Kostenarten = Erfassung und Gliederung der Kosten.");

Q(T1,"Welche Frage beantwortet die Kostenstellenrechnung?",
 ["Wo sind welche Kosten in welcher Höhe angefallen?",
  "Welche Kosten sind angefallen?",
  "Wofür sind die Kosten angefallen?",
  "Wie hoch sind die Zahlungsmittel?"],
 "Kostenstellen = Ort der Kostenentstehung; Verteilung der Gemeinkosten auf Kostenstellen.");

Q(T1,"Welche Frage beantwortet die Kostenträgerrechnung?",
 ["Wofür (für welches Produkt bzw. welche Leistung) sind die Kosten angefallen?",
  "Welche Kosten sind angefallen?",
  "Wo sind die Kosten angefallen?",
  "Welche Kosten sind fix?"],
 "Kostenträgerrechnung = Kalkulation, Ermittlung der Stückkosten und des Erfolgs je Produkt.");

Q(T1,"Welche Reihenfolge ist in der klassischen Kostenrechnung richtig?",
 ["Kostenartenrechnung → Kostenstellenrechnung → Kostenträgerrechnung",
  "Kostenträgerrechnung → Kostenstellenrechnung → Kostenartenrechnung",
  "Kostenstellenrechnung → Kostenartenrechnung → Kostenträgerrechnung",
  "Kostenartenrechnung → Kostenträgerrechnung → Kostenstellenrechnung"],
 "Die Kostenstellenrechnung ist das Bindeglied zwischen Kostenarten- und Kostenträgerrechnung.");

Q(T1,"Welchen Zeitbezug kann die KLR haben?",
 ["Vergangenheitsbezogen (Ist, Normal) und zukunftsbezogen (Plan)",
  "Nur vergangenheitsbezogen",
  "Nur zukunftsbezogen",
  "Keinen, sie ist zeitlos"],
 "Die Finanzbuchführung ist vergangenheitsorientiert, die KLR kann zusätzlich Plankosten abbilden.");

Q(T1,"Welche Entscheidung wird typischerweise durch die KLR unterstützt?",
 ["Eigenfertigung oder Fremdbezug",
  "Wahl der Rechtsform",
  "Höhe der Gewinnausschüttung",
  "Aufstellung des Anhangs"],
 "Typische KLR-Entscheidungen: Preisuntergrenze, Sortiment, Eigenfertigung vs. Fremdbezug, Art/Menge der Produkte, Vertriebswege.");

Q(T1,"Wofür wird die Kostenrechnung bei der Bewertung benötigt?",
 ["Ermittlung der Herstellkosten für Halb-/Fertigfabrikate und selbsterstellte Anlagen",
  "Ermittlung der Körperschaftsteuer",
  "Festlegung der Dividende",
  "Ermittlung des Zahlungsmittelbestands"],
 "Bewertung ist eine der drei KLR-Aufgaben neben Steuerung/Entscheidung und Überwachung/Wirtschaftlichkeitskontrolle.");

Q(T1,"Der Kauf einer Maschine gegen Banküberweisung führt zunächst zu …",
 ["Auszahlung und Ausgabe, aber (noch) nicht zu Aufwand",
  "Auszahlung und Aufwand in voller Höhe",
  "Aufwand und Kosten in voller Höhe",

 "Die Beschäftigungsabweichung wird durch den Soll-Ist-Vergleich eliminiert.");

Q(T8,"Was unterscheidet starre und flexible Plankostenrechnung?",
 ["Die flexible trennt fixe und variable Kosten und kann Plankosten für jede Beschäftigung bestimmen; die starre nicht",
  "Die starre trennt fixe und variable Kosten",
  "Die flexible arbeitet nur mit Fixkosten",
  "Es gibt keinen Unterschied"],
 "Flexible Plankostenrechnung kann auf Vollkosten- oder Teilkostenbasis erfolgen (Grenzplankostenrechnung).");

Q(T8,"Was ist die Grenzplankostenrechnung?",
 ["Flexible Plankostenrechnung auf Teilkostenbasis","Starre Plankostenrechnung auf Vollkostenbasis","Plankostenrechnung nur für Material","Eine Istkostenrechnung"],
 "Sie rechnet nur mit den variablen (proportionalen) Plankosten.");

Q(T8,"Wo liegt das Problem der starren Plankostenrechnung?",
 ["Die verrechneten Plankosten enthalten fixe Kosten und sind deshalb keine aussagefähige Sollgröße",
  "Sie hat keine Plankosten",
  "Sie berücksichtigt keine Ist-Kosten",
  "Sie darf nur für Material verwendet werden"],
 "Bei Beschäftigungsabweichungen werden Fixkosten nur anteilig verrechnet, so dass die Abweichung nicht interpretierbar ist.");

Q(T8,"Wie entsteht die Beschäftigungsabweichung in der flexiblen Plankostenrechnung?",
 ["Aus der Differenz Soll-Kosten – verrechnete Plankosten, weil bei geringerer Beschäftigung nicht alle Fixkosten verrechnet werden","Aus Preissteigerungen","Aus Mehrverbrauch","Aus einer falschen Inventur"],
 "Beschäftigungsabweichung = Soll-Kosten – verrechnete Plankosten.");

Q(T8,"Wie berechnet sich die Preis-/Verbrauchsabweichung?",
 ["Ist-Kosten – Soll-Kosten","Soll-Kosten – verrechnete Plankosten","Plankosten – Ist-Kosten","Ist-Kosten – verrechnete Plankosten"],
 "Ursachen: abweichende Faktorpreise und/oder abweichender Verbrauch der Einsatzmenge.");

Q(T8,"Wie berechnet sich die reine Preisabweichung?",
 ["Ist-Menge · (Ist-Preis – Plan-Preis)","Plan-Menge · (Ist-Preis – Plan-Preis)","Ist-Menge · Plan-Preis","(Ist-Menge – Plan-Menge) · Plan-Preis"],
 "Ist-Menge zu Ist-Preisen minus Ist-Menge zu Planpreisen.");

Q(T8,"Was ist die Abweichung 2. Grades (Mischabweichung)?",
 ["Die Mehrkosten aus dem Lohn-/Preisanstieg auf den Mehrverbrauch (Preisänderung · Mengenabweichung)",
  "Die doppelte Preisabweichung",
  "Eine Abweichung in der zweiten Periode",
  "Die Beschäftigungsabweichung"],
 "Sie entsteht, weil Preis und Menge gleichzeitig abweichen.");

Q(T8,"Welcher Ansatz ermittelt eine Kostenobergrenze ausgehend vom prognostizierten Marktpreis abzüglich Rabatte, Skonti und Plangewinn?",
 ["Target Costing","Prozesskostenrechnung","Behavioral Accounting","Flexible Plankostenrechnung"],
 "Die Kostenobergrenze ist Vorgabe für die Produktion (Market into Company).");

Q(T8,"Womit beschäftigt sich das Behavioral Accounting?",
 ["Mit der Wirkung von Informationen sowie Kosten- und Erlösvorgaben auf das Verhalten der Mitarbeiter","Mit der Zeitwertbilanzierung","Mit Zuschlagssätzen","Mit der Bewertung von Wertpapieren"],
 "Es untersucht, wie Rechnungswesen-Informationen das Verhalten beeinflussen.");

Q(T8,"Was besagt der Principal-Agent-Ansatz in der Kostenrechnung?",
 ["Statt Umlageschlüsseln können vertragliche Regelungen (Service-Level-Agreements) zwischen Auftraggebern und Beauftragten die Gemeinkostenzurechnung bestimmen",
  "Principals sind immer Lieferanten",
  "Kosten werden nur nach Marktpreisen verteilt",
  "Es gibt keine praktische Anwendung"],
 "Er erfasst die Beziehung zwischen Auftraggebern (Principals) und Beauftragten (Agents).");

Q(T8,"Welches Problem der Zuschlagskalkulation soll die Prozesskostenrechnung lösen?",
 ["Gemeinkosten indirekter Bereiche werden proportional auf Einzelkosten verrechnet und damit nicht verursachungsgerecht zugeordnet",
  "Die Einzelkosten sind zu hoch",
  "Die Fixkosten sind zu gering",
  "Die Kalkulation ist zu detailliert"],
 "Die Bearbeitung eines Kundenauftrags verursacht ähnliche Kosten unabhängig von der Stückzahl. Aufträge mit wenigen Stück werden zu niedrig, Aufträge mit vielen Stück zu hoch belastet.");

Q(T8,"Unter welchen Namen ist die Prozesskostenrechnung ebenfalls bekannt?",
 ["Activity-Based Costing (ABC), Cost-Driver-Accounting, aktivitätsorientierte Kostenrechnung","Target Costing","Grenzplankostenrechnung","Equivalence Costing"],
 "Entwickelt in den 1980er-Jahren von Cooper und Kaplan.");

Q(T8,"Welche Ziele verfolgt die Prozesskostenrechnung?",
 ["Verursachungsgerechte Produktkosten, Prozessverbesserung/Kostensenkung und Kostenmanagement",
  "Nur die Steuerminimierung",
  "Nur die Bestandsbewertung",
  "Nur die Ermittlung von Zuschlagssätzen für Material"],
 "Dazu zählen z. B. die Eliminierung nicht wertschöpfender Prozesse und strategische Planung.");

Q(T8,"Wie ist die Prozesshierarchie aufgebaut?",
 ["Aktivität → Teilprozess (kostenstellenbezogen) → Hauptprozess (kostenstellenübergreifend)","Hauptprozess → Aktivität → Teilprozess","Teilprozess → Kostenstelle → Aktivität","Kostenträger → Kostenart → Prozess"],
 "Teilprozesse fassen gleichartige Tätigkeiten einer Kostenstelle zusammen, Hauptprozesse sind kostenstellenübergreifend.");

Q(T8,"Welche Beispiele für Hauptprozesse sind im Bankenbereich genannt?",
 ["Kreditvergabe, Aktienorder bzw. Beratung, Einstellung von Mitarbeitern","Fertigung, Montage","Materialeinkauf, Lagerhaltung","Inventur, Bilanzierung"],
 "Z. B. Kreditvergabe mit den Teilprozessen Antrag bearbeiten, Prüfung, Bewilligung.");

C(T8,"Starre Plankostenrechnung: Planmenge 2.000 Stück, Plankosten 30.000 €, Verrechnungssatz 15 €/Stück. Ist: 1.500 Stück, Ist-Kosten 28.000 €. Wie hoch sind die verrechneten Plankosten?",
 ["22.500 €","25.000 €","28.000 €","30.000 €"],0,
 "1.500 · 15 € = 22.500 €. Die Gesamtabweichung beträgt 28.000 – 22.500 = 5.500 €.","Skript 7.2");
C(T8,"Flexible Plankostenrechnung: Planmenge 2.000, Plankosten 30.000 €, davon fix 10.000 € (K = 10.000 + 10 · x). Ist: 1.500 Stück, Ist-Kosten 28.000 €. Wie hoch sind die Soll-Kosten?",
 ["22.500 €","25.000 €","28.000 €","30.000 €"],1,
 "10.000 + 10 · 1.500 = 25.000 €.","Skript 7.3");
C(T8,"Wie hoch ist die Beschäftigungsabweichung (Soll-Kosten 25.000 €, verrechnete Plankosten 22.500 €)?",
 ["2.500 €","3.000 €","5.500 €","10.000 €"],0,
 "25.000 – 22.500 = 2.500 €. Nur 25 % der Fixkosten (500 von 2.000 Stück) wurden verrechnet.","Skript 7.3");
C(T8,"Wie hoch ist die Preis-/Verbrauchsabweichung (Ist-Kosten 28.000 €, Soll-Kosten 25.000 €)?",
 ["2.500 €","3.000 €","5.500 €","28.000 €"],1,
 "28.000 – 25.000 = 3.000 €. Gesamtabweichung 5.500 = 2.500 Beschäftigungsabweichung + 3.000 Preis-/Verbrauchsabweichung.","Skript 7.3");
C(T8,"Fertigung: Plan 500 Stück, je Stück 4 Std. à 20 €. Ist: 500 Stück, Stundenlohn 21 €, Fertigungseinzelkosten Ist 50.000 €. Wie hoch ist die Preisabweichung?",
 ["1.000 €","2.000 €","8.000 €","10.000 €"],1,
 "Ist-Menge (2.000 Std.) · (21 – 20) = 2.000 €. Die Gesamtabweichung beträgt 10.000 € (50.000 – 40.000), die Verbrauchsabweichung 8.000 €.","Skript 7.4, Fallbeispiel 1");
C(T8,"Gesamtabweichung in der Fertigung 10.000 €, Preisabweichung 2.000 €, Verbrauchsabweichung 8.000 € (Ist-Preis 21 €/Std., Plan-Preis 20 €/Std.). Wie hoch ist die reine Verbrauchsabweichung?",
 ["380,95 €","7.619 €","8.000 €","8.381 €"],1,
 "8.000 / 21 = 380,95 Std. · 20 € = 7.619 €. Die Abweichung 2. Grades beträgt 380,95 · 1 € = 381 €.","Skript 7.4, Fallbeispiel 1");
C(T8,"Plan: 500 Stück (Material 20 €/Stk., Fertigung 4 Std. à 20 €, Gemeinkosten fix 5.000 € → Plankosten 55.000 €). Ist-Menge 400 Stück. Wie hoch sind die Soll-Kosten?",
 ["44.000 €","45.000 €","52.000 €","55.000 €"],1,
 "Material 400 · 20 = 8.000 + Fertigung 400 · 80 = 32.000 + fixe Gemeinkosten 5.000 = 45.000 €. Die verrechneten Plankosten betragen 55.000 / 500 · 400 = 44.000 €.","Skript 7.4, Fallbeispiel 2");
C(T8,"Fallbeispiel 2: Ist-Kosten 52.000 €, Soll-Kosten 45.000 €, verrechnete Plankosten 44.000 €. Wie hoch sind Beschäftigungsabweichung und Preis-/Verbrauchsabweichung?",
 ["Beschäftigungsabweichung 1.000 €, Preis-/Verbrauchsabweichung 7.000 €","Beschäftigungsabweichung 7.000 €, Preis-/Verbrauchsabweichung 1.000 €","Beschäftigungsabweichung 8.000 €, Preis-/Verbrauchsabweichung 0 €","Beschäftigungsabweichung 0 €, Preis-/Verbrauchsabweichung 8.000 €"],0,
 "Soll – verrechnete Plankosten = 45.000 – 44.000 = 1.000 €. Ist – Soll = 52.000 – 45.000 = 7.000 €. Gesamtabweichung 8.000 €.","Skript 7.4, Fallbeispiel 2");


(function(){
'use strict';
const KEY='klr-lernfragen-v1';
const app=document.getElementById('app');

/* ---------- Speicher ---------- */
let store={stats:{},n:25};
try{
  const raw=JSON.parse(localStorage.getItem(KEY));
  if(raw&&raw.stats) store=Object.assign(store,raw);
}catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){} }

/* ---------- Hilfsfunktionen ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
QS.forEach(q=>{q.id=hash(q.t+'|'+q.q+'|'+q.o.join('|'));});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(k==='class')el.className=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false)return; el.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return el;
}
function bar(p,cls){return h('div',{class:'bar '+(cls||'')},h('i',{style:'width:'+Math.round(p*100)+'%'}));}
function mount(...nodes){app.replaceChildren(...nodes.flat().filter(Boolean));window.scrollTo(0,0);}
const stat=q=>store.stats[q.id];
const isWrong=q=>{const s=stat(q);return s&&s.r==='w';};
const isNew=q=>!stat(q);
const isOk=q=>{const s=stat(q);return s&&s.r==='c';};

/* ---------- Startseite ---------- */
function home(){
  const total=QS.length, ok=QS.filter(isOk).length, wrong=QS.filter(isWrong).length, fresh=QS.filter(isNew).length;

  const lengthSeg=h('div',{class:'seg'},[10,25,50,0].map(n=>
    h('button',{class:store.n===n?'on':'',onclick:()=>{store.n=n;save();home();}},n===0?'Alle':String(n))));

  const quick=h('div',{class:'card'},
    h('div',{class:'small'},'Fragen pro Runde'),
    lengthSeg,
    h('button',{class:'btn primary',onclick:()=>start(QS,store.n)},'Runde starten'),
    h('div',{class:'btn-row'},
      h('button',{class:'btn',disabled:!wrong,onclick:()=>start(QS.filter(isWrong),0)},'Falsche wiederholen ('+wrong+')'),
      h('button',{class:'btn',disabled:!fresh,onclick:()=>start(QS.filter(isNew),store.n)},'Neue Fragen ('+fresh+')'))
  );

  const progress=h('div',{class:'card'},
    h('div',{class:'top',style:'display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px'},
      h('span',null,'Fortschritt'),h('span',{class:'small'},ok+' von '+total+' richtig')),
    bar(total?ok/total:0,'green'),
    h('div',{class:'small',style:'margin-top:8px'},'Zählt, wenn die Frage zuletzt richtig beantwortet wurde.'));

  const topicRows=TOPICS.map(t=>{
    const pool=QS.filter(q=>q.t===t), o=pool.filter(isOk).length;
    return h('button',{class:'row',onclick:()=>start(pool,store.n)},
      h('div',{class:'top'},h('span',null,t),h('span',null,o+' / '+pool.length)),
      bar(pool.length?o/pool.length:0,'green'));
  });
  const kindRows=Object.keys(KINDS).map(k=>{
    const pool=QS.filter(q=>q.k===k), o=pool.filter(isOk).length;
    return h('button',{class:'row',onclick:()=>start(pool,store.n)},
      h('div',{class:'top'},h('span',null,KINDS_PL[k]),h('span',null,o+' / '+pool.length)),
      bar(pool.length?o/pool.length:0,'green'));
  });

  mount(
    h('h1',null,'KLR Lernfragen'),
    h('p',{class:'sub'},total+' Fragen · Kosten- und Leistungsrechnung · eine Frage nach der anderen'),
    progress,quick,
    h('h2',null,'Nach Thema'),topicRows,
    h('h2',null,'Nach Fragetyp'),kindRows,
    h('div',{class:'center',style:'margin-top:18px'},
      h('button',{class:'btn-link',onclick:()=>{
        if(confirm('Gesamten Lernfortschritt zurücksetzen?')){store.stats={};save();home();}
      }},'Fortschritt zurücksetzen'))
  );
}

/* ---------- Runde zusammenstellen ---------- */
function start(pool,n){
  if(!pool.length)return;
  const g=[[],[],[]];
  pool.forEach(q=>{g[isNew(q)?0:isWrong(q)?1:2].push(q);});
  let ordered=[].concat(shuffle(g[0]),shuffle(g[1]),shuffle(g[2]));
  if(n&&n<ordered.length)ordered=ordered.slice(0,n);
  sess={list:shuffle(ordered),i:0,res:[],view:null};
  showQuestion();
}
let sess=null;

/* ---------- Frage ---------- */
function showQuestion(){
  const q=sess.list[sess.i];
  const idx=q.o.map((_,i)=>i);
  const order=q.shuffle?shuffle(idx):idx;
  const state={q,order,done:false};
  sess.view=state;
  const tf=q.k==='f';
  const cut=q.q.lastIndexOf('\n\n');
  const ctx=cut>0?q.q.slice(0,cut):'';
  const ask=cut>0?q.q.slice(cut+2):q.q;
  const optEls=order.map((oi,pos)=>{
    const btn=h('button',{class:'opt'+(tf?' tf':''),onclick:()=>answer(oi,optEls)},
      tf?null:h('span',{class:'L'},String.fromCharCode(65+pos)),
      h('span',{class:'T'},q.o[oi]));
    btn.dataset.oi=oi;
    return btn;
  });
  state.optEls=optEls;

  const fbBox=h('div',{id:'fb'});
  const last=sess.i===sess.list.length-1;
  const nextBtn=h('button',{class:'btn primary hidden',id:'next',onclick:next},last?'Ergebnis anzeigen':'Weiter');

  mount(
    h('div',{class:'qtop'},
      h('div',{class:'grow'},
        h('div',{class:'small',style:'margin-bottom:6px'},'Frage '+(sess.i+1)+' von '+sess.list.length),
        bar(sess.i/sess.list.length)),
      h('button',{class:'end',onclick:finish},'Beenden')),
    h('div',{class:'chips'},
      h('span',{class:'chip type'},KINDS[q.k]),
      h('span',{class:'chip'},q.t),
      q.s?h('span',{class:'chip'},q.s):null),
    ctx?h('div',{class:'ctx'},ctx):null,
    h('p',{class:'question'},ask),
    tf?h('div',{class:'small',style:'margin:-8px 0 12px'},'Ist die Aussage richtig oder falsch?'):null,
    h('div',{class:'opts'},optEls),
    fbBox,
    h('div',{class:'next'},nextBtn)
  );
}

function answer(oi,optEls){
  const st=sess.view; if(st.done)return; st.done=true;
  const q=st.q, ok=oi===q.a;
  optEls.forEach(b=>{
    const i=+b.dataset.oi;
    b.disabled=true;
    if(i===q.a)b.classList.add('correct');
    else if(i===oi)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  sess.res.push({q,pick:oi,ok});
  const s=store.stats[q.id]||(store.stats[q.id]={c:0,w:0,r:'c'});
  if(ok){s.c++;s.r='c';}else{s.w++;s.r='w';}
  save();

  const fb=document.getElementById('fb');
  fb.replaceChildren(h('div',{class:'fb '+(ok?'ok':'no'),role:'status'},
    h('h3',null,ok?'Richtig!':'Leider falsch.'),
    ok?null:h('p',null,'Richtige Antwort: '+q.o[q.a]),
    q.e?h('p',null,q.e):null));
  const nb=document.getElementById('next');
  nb.classList.remove('hidden');
  fb.firstChild.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function next(){
  if(sess.i<sess.list.length-1){sess.i++;showQuestion();}
  else finish();
}

/* ---------- Ergebnis ---------- */
function finish(){
  if(!sess||!sess.res.length){home();return;}
  const res=sess.res, n=res.length, ok=res.filter(r=>r.ok).length, pct=Math.round(ok/n*100);
  const wrong=res.filter(r=>!r.ok);
  const msg=pct>=90?'Sehr stark.':pct>=70?'Gut, weiter so.':pct>=50?'Solide Basis, die Erklärungen helfen beim Festigen.':'Noch Luft nach oben, wiederhole die falschen Fragen.';

  const byTopic=TOPICS.map(t=>{
    const r=res.filter(x=>x.q.t===t); if(!r.length)return null;
    const o=r.filter(x=>x.ok).length;
    return h('div',{style:'margin-bottom:10px'},
      h('div',{style:'display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px'},h('span',null,t),h('span',{class:'small'},o+' / '+r.length)),
      bar(o/r.length,'green'));
  });

  const wrongList=wrong.map(r=>h('details',{class:'wr'},
    h('summary',null,r.q.q.includes('\n\n')?r.q.q.slice(r.q.q.lastIndexOf('\n\n')+2):r.q.q),
    h('div',{class:'in'},
      h('p',null,h('span',{class:'ans-no'},'Deine Antwort: '),r.q.o[r.pick]),
      h('p',null,h('span',{class:'ans-ok'},'Richtig: '),r.q.o[r.q.a]),
      r.q.e?h('p',{class:'small'},r.q.e):null)));

  const again=wrong.length?h('button',{class:'btn primary',onclick:()=>start(wrong.map(r=>r.q),0)},'Falsche wiederholen ('+wrong.length+')'):null;

  mount(
    h('h1',{class:'center'},'Runde beendet'),
    h('div',{class:'score'},ok+' ',h('small',null,'von '+n+' richtig ('+pct+' %)')),
    h('p',{class:'sub center'},msg),
    h('div',{class:'card'},byTopic),
    wrong.length?h('h2',null,'Falsch beantwortet'):null,
    wrongList,
    h('div',{style:'margin-top:14px;display:grid;gap:10px'},
      again,
      h('button',{class:'btn'+(again?'':' primary'),onclick:()=>start(QS,store.n)},'Neue Runde'),
      h('button',{class:'btn',onclick:()=>{sess=null;home();}},'Zur Übersicht'))
  );
}

/* ---------- Tastatur (iPad mit Tastatur / Desktop) ---------- */
document.addEventListener('keydown',e=>{
  if(!sess||!sess.view||!document.getElementById('next'))return;
  const st=sess.view;
  if(!st.done&&/^[1-9]$/.test(e.key)){
    const b=st.optEls[+e.key-1]; if(b)b.click();
  }else if(st.done&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){
    e.preventDefault();next();
  }
});

home();
})();
</script>
